services:
    shopware:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8000"
        environment:
            DATABASE_URL: "mysql://shopware:shopware@database:3306/shopware"
            APP_URL: "http://localhost:8080"
            APP_SECRET: "devsecret"
            REDIS_URL: "redis://redis:6379"
            LOCK_DSN: "redis://redis:6379/2"
            S3_ENDPOINT: "http://minio:9000"
            S3_PUBLIC_URL: "http://localhost:9000/shopware-public"
            S3_BUCKET: "shopware-public"
            S3_BUCKET_PRIVATE: "shopware-private"
            S3_REGION: "eu-central-1"
            S3_ACCESS_KEY: "minioadmin"
            S3_SECRET_KEY: "minioadmin"
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started

    database:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: shopware
            MYSQL_USER: shopware
            MYSQL_PASSWORD: shopware
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: valkey/valkey:8
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: [ "CMD", "valkey-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - minio-data:/data

    minio-client:
        image: minio/mc:latest
        depends_on:
            - minio
        profiles:
            - tools
        entrypoint: [ "/bin/sh", "-c" ]
        command: >
            "until mc alias set local http://minio:9000 minioadmin minioadmin; do
              echo 'Waiting for MinIO...';
              sleep 2;
            done;
            mc mb --ignore-existing local/shopware-public;
            mc mb --ignore-existing local/shopware-private;
            mc anonymous set download local/shopware-public"

volumes:
    db-data:
    redis-data:
    minio-data:
