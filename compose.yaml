services:
    shopware:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8000"
        environment:
            DATABASE_URL: "mysql://shopware:shopware@database:3306/shopware"
            APP_URL: "http://localhost:8080"
            REDIS_URL: "redis://redis:6379"
            LOCK_DSN: "redis://redis:6379/2"
            S3_ENDPOINT: "http://rustfs:9000"
            S3_PUBLIC_URL: "http://localhost:9000/shopware-public"
            S3_BUCKET: "shopware-public"
            S3_BUCKET_PRIVATE: "shopware-private"
            S3_REGION: "eu-central-1"
            S3_ACCESS_KEY: "rustfsadmin"
            S3_SECRET_KEY: "rustfsadmin"
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            rustfs:
                condition: service_healthy

    database:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: shopware
            MYSQL_USER: shopware
            MYSQL_PASSWORD: shopware
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: valkey/valkey:8
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: [ "CMD", "valkey-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    rustfs:
        image: rustfs/rustfs:1.0.3
        command: /data
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9001:9001"
        environment:
            RUSTFS_ACCESS_KEY: "rustfsadmin"
            RUSTFS_SECRET_KEY: "rustfsadmin"
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_CONSOLE_ADDRESS: ":9001"
        volumes:
            - rustfs-data:/data
        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health/ready"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    s3-client:
        image: amazon/aws-cli:2.41.0
        depends_on:
            rustfs:
                condition: service_healthy
        profiles:
            - tools
        environment:
            AWS_ACCESS_KEY_ID: "rustfsadmin"
            AWS_SECRET_ACCESS_KEY: "rustfsadmin"
            AWS_DEFAULT_REGION: "eu-central-1"
            AWS_PAGER: ""
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                aws configure set default.s3.addressing_style path
                until aws --endpoint-url http://rustfs:9000 s3api list-buckets > /dev/null 2>&1; do
                  echo "Waiting for RustFS..."
                  sleep 2
                done
                aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket shopware-public 2> /dev/null \
                  || aws --endpoint-url http://rustfs:9000 s3 mb s3://shopware-public
                aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket shopware-private 2> /dev/null \
                  || aws --endpoint-url http://rustfs:9000 s3 mb s3://shopware-private
                aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy \
                  --bucket shopware-public \
                  --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::shopware-public/*"]}]}'

volumes:
    db-data:
    redis-data:
    rustfs-data:
